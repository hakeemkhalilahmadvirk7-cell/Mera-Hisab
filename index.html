

<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>میرا حساب | Mera Hisab — ڈیجیٹل کھاتہ سسٹم</title>
  <!-- PDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f3f7f5;
      color: #17352c;
    }
    header {
      background: #116149;
      color: white;
      text-align: center;
      padding: 20px 16px;
    }
    header h1 { margin: 0 0 5px; font-size: 28px; }
    header p { margin: 0; font-size: 13px; }
    main {
      max-width: 850px;
      margin: 20px auto;
      padding: 0 16px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 4px 16px #17352c10;
    }
    h2, h3 { color: #116149; margin-top: 0; }
    
    .ad-banner {
      background: #e9ecef;
      border: 1px dashed #adb5bd;
      text-align: center;
      padding: 10px;
      margin: 10px 0;
      font-size: 12px;
      color: #6c757d;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    label { font-size: 12px; font-weight: bold; display: block; margin-bottom: 3px; }
    input, select {
      width: 100%;
      padding: 9px;
      border: 1px solid #cbd5d0;
      border-radius: 6px;
      font-size: 13px;
    }
    .full-width { grid-column: 1 / -1; }

    button {
      border: 0;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
      cursor: pointer;
      background: #116149;
      color: white;
      font-weight: bold;
    }
    button:hover { background: #0d4d39; }
    button.secondary { background: #e3f1eb; color: #116149; border: 1px solid #b7d9c9; }
    button.calc-btn { background: #f39c12; color: white; }
    button.pdf-btn { background: #e74c3c; color: white; padding: 5px 8px; font-size: 11px; }
    button.whatsapp-btn { background: #25d366; color: white; }

    .dashboard-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
    }
    .summary-box {
      background: #f3f7f5;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    .summary-box p { margin: 5px 0 0; font-weight: bold; font-size: 15px; }

    /* Modal / Pop-up Calculator */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .calc-box {
      background: white;
      padding: 15px;
      border-radius: 12px;
      width: 260px;
      text-align: center;
    }
    .calc-screen {
      width: 100%;
      height: 40px;
      font-size: 18px;
      text-align: left;
      margin-bottom: 10px;
      padding: 5px;
    }
    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }
    .calc-grid button {
      padding: 12px;
      font-size: 14px;
      background: #e1ebe6;
      color: #17352c;
    }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 9px; border-bottom: 1px solid #e1ebe6; text-align: right; }
    th { background: #f3f7f5; color: #116149; }
  </style>
</head>
<body>

  <header>
    <h1>میرا حساب</h1>
    <p>آپ کے کاروبار کا ڈیجیٹل کھاتہ سسٹم</p>
  </header>

  <main>
    <div class="ad-banner">گوگل ایڈسینس ایڈ اسپیس (Top Ad)</div>

    <!-- لاگ ان فارم -->
    <section class="card" id="loginCard">
      <h2>دکاندار لاگ اِن / رجسٹریشن</h2>
      <form id="authForm">
        <div>
          <label>ای میل</label>
          <input type="email" id="email" required placeholder="shop@email.com">
        </div>
        <div>
          <label>پاس ورڈ (کم از کم 8 ہندسے)</label>
          <input type="password" id="password" required minlength="8" placeholder="********">
        </div>
        <div class="full-width" style="display: flex; gap: 10px; margin-top: 5px;">
          <button type="submit" id="loginBtn" style="flex: 1;">لاگ اِن کریں</button>
          <button type="button" id="signupBtn" class="secondary" style="flex: 1;">نیا اکاؤنٹ بنائیں</button>
        </div>
      </form>
      <p id="authMsg" style="font-size: 12px; font-weight: bold; margin-top: 8px;"></p>
    </section>

    <!-- ڈیش بورڈ (لاگ ان کے بعد ظاہر ہوگا) -->
    <section class="card" id="dashboardCard" hidden>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h2 id="shopTitle" style="margin:0;">دکاندار کا ڈیش بورڈ</h2>
        <div>
          <button class="calc-btn" onclick="toggleCalc()" style="padding: 6px 10px; font-size: 12px;">🧮 کیلکولیٹر</button>
          <button class="secondary" id="logoutBtn" style="padding: 6px 10px; font-size: 12px;">لاگ آؤٹ</button>
        </div>
      </div>

      <div class="dashboard-summary">
        <div class="summary-box"><h4>کل گاہک</h4><p id="totalCust">0</p></div>
        <div class="summary-box"><h4>کل بقایا</h4><p id="totalBal" style="color:#b33939;">0 روپے</p></div>
      </div>

      <hr style="margin: 15px 0;">

      <!-- نیا گاہک درج کرنے کا فارم -->
      <h3>نیا گاہک شامل کریں</h3>
      <form id="customerForm">
        <div>
          <label>گاہک کا نام</label>
          <input type="text" id="cName" required placeholder="مثلاً: احمد خان">
        </div>
        <div>
          <label>موبائل نمبر (واٹس ایپ کے لیے)</label>
          <input type="tel" id="cPhone" required placeholder="03001234567">
        </div>
        <div>
          <label>رقم (روپے)</label>
          <input type="number" id="cAmount" required placeholder="0">
        </div>
        <div>
          <label>قسم</label>
          <select id="cType">
            <option value="credit">ادھار دیا (+)</option>
            <option value="payment">رقم وصول کی (-)</option>
          </select>
        </div>
        <div class="full-width">
          <button type="submit">محفوظ کریں</button>
        </div>
      </form>

      <hr style="margin: 15px 0;">

      <h3>گاہکوں کا کھاتہ (Ledger)</h3>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr><th>نام</th><th>فون</th><th>بقایا</th><th>PDF رسید</th></tr>
          </thead>
          <tbody id="customerTableBody">
            <tr><td colspan="4" style="text-align:center; color:#60776d;">کوئی گاہک موجود نہیں۔</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <div class="ad-banner">گوگل ایڈسینس ایڈ اسپیس (Bottom Ad)</div>
  </main>

  <!-- کیلکولیٹر ماڈل -->
  <div class="modal" id="calcModal">
    <div class="calc-box">
      <h3>کیلکولیٹر</h3>
      <input type="text" class="calc-screen" id="calcDisplay" readonly>
      <div class="calc-grid">
        <button onclick="calcInput('7')">7</button><button onclick="calcInput('8')">8</button><button onclick="calcInput('9')">9</button><button onclick="calcInput('/')">/</button>
        <button onclick="calcInput('4')">4</button><button onclick="calcInput('5')">5</button><button onclick="calcInput('6')">6</button><button onclick="calcInput('*')">*</button>
        <button onclick="calcInput('1')">1</button><button onclick="calcInput('2')">2</button><button onclick="calcInput('3')">3</button><button onclick="calcInput('-')">-</button>
        <button onclick="calcClear()">C</button><button onclick="calcInput('0')">0</button><button onclick="calcResult()">=</button><button onclick="calcInput('+')">+</button>
      </div>
      <button onclick="toggleCalc()" class="secondary" style="margin-top: 10px; width: 100%;">بند کریں</button>
    </div>
  </div>

  <!-- Supabase Script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://lsjafuxasaijybhbopjf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_l0Y4PJksE_y9Y0ttNMSA1Q_W8XVxoAS";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;

    // سیشن چیک کریں
    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        currentUser = session.user;
        showDashboard();
      }
    }
    checkAuth();

    // لاگ ان
    document.getElementById('authForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('authMsg');

      msg.textContent = "لاگ ان ہو رہا ہے...";
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        msg.textContent = "خامی: " + error.message;
      } else {
        currentUser = data.user;
        showDashboard();
      }
    });

    // سائن اپ
    document.getElementById('signupBtn').addEventListener('click', async function() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('authMsg');

      if(!email || !password) {
        msg.textContent = "براہ کرم ای میل اور پاس ورڈ درج کریں۔";
        return;
      }

      msg.textContent = "اکاؤنٹ بن رہا ہے...";
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if (error) {
        msg.textContent = "خامی: " + error.message;
      } else {
        msg.textContent = "اکاؤنٹ بن گیا ہے! اب لاگ ان کریں۔";
      }
    });

    // لاگ آؤٹ
    document.getElementById('logoutBtn').addEventListener('click', async function() {
      await supabaseClient.auth.signOut();
      currentUser = null;
      document.getElementById('dashboardCard').hidden = true;
      document.getElementById('loginCard').hidden = false;
    });

    function showDashboard() {
      document.getElementById('loginCard').hidden = true;
      document.getElementById('dashboardCard').hidden = false;
      document.getElementById('shopTitle').textContent = currentUser.email + " — ڈیش بورڈ";
      loadCustomers();
    }

    // گاہک محفوظ کرنا
    document.getElementById('customerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('cName').value.trim();
      const phone = document.getElementById('cPhone').value.trim();
      const amount = parseFloat(document.getElementById('cAmount').value) || 0;
      const type = document.getElementById('cType').value;

      let netAmount = type === 'credit' ? amount : -amount;
      let db = JSON.parse(localStorage.getItem('khata_' + currentUser.id) || '[]');

      let existing = db.find(c => c.name === name);
      if(existing) {
        existing.balance += netAmount;
        existing.phone = phone;
      } else {
        db.push({ name, phone, balance: netAmount });
      }

      localStorage.setItem('khata_' + currentUser.id, JSON.stringify(db));
      document.getElementById('customerForm').reset();
      loadCustomers();
    });

    // گاہک لوڈ کرنا
    function loadCustomers() {
      let db = JSON.parse(localStorage.getItem('khata_' + currentUser.id) || '[]');
      const tbody = document.getElementById('customerTableBody');
      const totalCustEl = document.getElementById('totalCust');
      const totalBalEl = document.getElementById('totalBal');

      tbody.innerHTML = "";
      let totalBal = 0;

      if(db.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#60776d;">کوئی گاہک موجود نہیں۔</td></tr>`;
        totalCustEl.textContent = "0";
        totalBalEl.textContent = "0 روپے";
        return;
      }

      db.forEach(c => {
        totalBal += c.balance;
        let tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${c.name}</td>
          <td>${c.phone}</td>
          <td style="color: ${c.balance > 0 ? '#b33939' : '#27ae60'}; font-weight: bold;">${c.balance} روپے</td>
          <td><button class="pdf-btn" onclick="generatePDF('${c.name}', ${c.balance})">PDF</button></td>
        `;
        tbody.appendChild(tr);
      });

      totalCustEl.textContent = db.length;
      totalBalEl.textContent = totalBal + " روپے";
    }

    // کیلکولیٹر فنکشنز
    function toggleCalc() {
      const modal = document.getElementById('calcModal');
      modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
    }
    function calcInput(val) { document.getElementById('calcDisplay').value += val; }
    function calcClear() { document.getElementById('calcDisplay').value = ''; }
    function calcResult() {
      try { document.getElementById('calcDisplay').value = eval(document.getElementById('calcDisplay').value); }
      catch { document.getElementById('calcDisplay').value = 'Error'; }
    }

    // PDF جنریٹر
    function generatePDF(name, balance) {
      const element = document.createElement('div');
      element.innerHTML = `
        <div style="padding: 20px; font-family: Tahoma; direction: rtl; text-align: right;">
          <h1 style="color: #116149;">میرا حساب — کھاتہ رسید</h1>
          <hr>
          <h3>گاہک کا نام: ${name}</h3>
          <h3>بقایا رقم: <span style="color: red;">${balance} روپے</span></h3>
          <p>تاریخ: ${new Date().toLocaleDateString('ur-PK')}</p>
        </div>
      `;
      html2pdf().from(element).save(`${name}_Khata.pdf`);
    }
  </script>
</body>
</html>
